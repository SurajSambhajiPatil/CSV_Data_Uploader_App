spring.application.name=CSV_Data_Uploader_App

server.port=9191

#datasource properties
spring.datasource.url =jdbc:mysql://localhost:3306/cloud_bytes?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasouce.driver-class-name=com.mysql.jdbc.Driver

#To Print queries o console
spring.jpa.show-sql=true

#To Create Table Dynamically
spring.jpa.hibernate.ddl-auto=update


springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

